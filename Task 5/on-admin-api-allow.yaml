apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-for-role-pods
  namespace: network-task
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: network-task
spec:
  podSelector:
    matchLabels:
      role: back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: front-end
      ports:
        - protocol: TCP
          port: 80
---
