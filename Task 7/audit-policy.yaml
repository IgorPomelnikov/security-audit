apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods"]
    namespaces: ["audit-zone"]
  
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods"]
    verbs: ["create", "update"]
    namespaces: ["audit-zone"]
  
  - level: Request
    resources:
      - group: "constraints.gatekeeper.sh"
        resources: ["*"]
  
  - level: RequestResponse
    omitStages:
      - "RequestReceived"
